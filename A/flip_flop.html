<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador JK Flip-Flop - Ingeniería</title>
    <style>
        :root {
            --primary: #0056b3;
            --bg: #f0f2f5;
            --panel: #ffffff;
            --text: #333;
            --wire-off: #555;
            --wire-on: #e74c3c; /* Rojo para señal activa */
            --led-off: #444;
            --led-on: #ff3333;
            --led-glow: 0 0 10px #ff3333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- Header & Footer --- */
        header {
            background: linear-gradient(135deg, #004085, #0056b3);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .btn-back {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.5);
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-back:hover { background: rgba(255,255,255,0.4); }

        footer {
            text-align: center;
            padding: 15px;
            font-size: 0.8rem;
            color: #777;
            background: #e9ecef;
            margin-top: auto;
        }

        /* --- Layout --- */
        main {
            padding: 20px;
            display: grid;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            grid-template-columns: 1fr;
        }

        @media (min-width: 900px) {
            main {
                grid-template-columns: 2fr 1fr; /* Izquierda más ancha para gráfico */
                grid-template-rows: auto auto;
            }
            .panel-schematic { grid-column: 1 / 2; }
            .panel-controls { grid-column: 2 / 3; }
            .panel-scope { grid-column: 1 / 3; } /* Abajo ancho completo */
        }

        .card {
            background: var(--panel);
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            padding: 20px;
            border: 1px solid #ddd;
        }

        h2 { font-size: 1.2rem; color: #444; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-top: 0; }

        /* --- SVG Diagram Styles --- */
        .svg-container {
            width: 100%;
            display: flex;
            justify-content: center;
        }
        
        svg {
            max-width: 100%;
            height: auto;
            max-height: 300px;
        }

        /* Estilos base del SVG */
        .circuit-wire { fill: none; stroke: var(--wire-off); stroke-width: 3; stroke-linecap: round; transition: stroke 0.2s; }
        .circuit-box { fill: #fff; stroke: #333; stroke-width: 3; }
        .circuit-text { font-family: monospace; font-weight: bold; fill: #333; font-size: 14px; user-select: none; }
        .pin-label { font-size: 12px; fill: #666; }
        
        .led-indicator { fill: var(--led-off); stroke: #222; stroke-width: 1; transition: fill 0.1s; }
        
        /* Clases activas para SVG */
        .wire-active { stroke: var(--wire-on); }
        .led-active { fill: var(--led-on); filter: drop-shadow(0 0 5px #ff3333); }

        /* --- Controls --- */
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .switch-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
        }

        /* Toggle Switch CSS */
        .toggle {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
        }
        .toggle input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 20px; width: 20px;
            left: 4px; bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(22px); }

        /* Clock Button */
        .btn-clock {
            background: #333;
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px #000;
            transform: translateY(0);
            transition: 0.1s;
        }
        .btn-clock:active {
            transform: translateY(4px);
            box-shadow: 0 0 #000;
        }

        /* --- Canvas Oscilloscope --- */
        canvas {
            width: 100%;
            height: 120px;
            background: #222;
            border-radius: 4px;
            border: 1px solid #444;
        }
        .legend {
            display: flex;
            gap: 15px;
            justify-content: center;
            font-size: 0.85rem;
            margin-top: 5px;
        }
        .dot { width: 10px; height: 10px; display: inline-block; border-radius: 50%; margin-right: 5px; }

        /* Tabla informativa pequeña */
        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            background: #eee;
            border-radius: 4px;
            font-weight: bold;
            margin-top: 10px;
            border-left: 5px solid #ccc;
        }
    </style>
</head>
<body>

<header>
    <div style="font-weight: bold; font-size: 1.2rem;">Lab. Electrónica Digital</div>
    <button class="btn-back" onclick="goBack()">Volver</button>
</header>

<main>
    <div class="card panel-schematic">
        <h2>Diagrama Lógico (Flip-Flop JK)</h2>
        <div class="svg-container">
            <svg viewBox="0 0 500 250">
                <path d="M 50 70 L 150 70" id="wire-j" class="circuit-wire" />
                <path d="M 50 180 L 150 180" id="wire-k" class="circuit-wire" />
                <path d="M 50 125 L 150 125" id="wire-clk" class="circuit-wire" />

                <rect x="150" y="40" width="200" height="170" rx="5" class="circuit-box" />
                
                <text x="30" y="75" class="circuit-text">J</text>
                <text x="30" y="185" class="circuit-text">K</text>
                <text x="25" y="130" class="circuit-text">CLK</text>

                <text x="160" y="75" class="pin-label">J</text>
                <text x="160" y="185" class="pin-label">K</text>
                
                <path d="M 150 115 L 170 125 L 150 135" fill="none" stroke="#333" stroke-width="2"/>

                <text x="320" y="75" class="pin-label">Q</text>
                <text x="320" y="185" class="pin-label">Q'</text>
                <text x="470" y="75" class="circuit-text">Q</text>
                <text x="470" y="185" class="circuit-text">Q'</text>

                <path d="M 350 70 L 450 70" id="wire-q" class="circuit-wire" />
                <path d="M 350 180 L 450 180" id="wire-qnot" class="circuit-wire" />
                
                <circle cx="400" cy="70" r="8" id="led-q" class="led-indicator" />
                <circle cx="400" cy="180" r="8" id="led-qnot" class="led-indicator" />

                <text x="250" y="130" text-anchor="middle" font-size="24" font-weight="bold" fill="#333">JK</text>
            </svg>
        </div>
        <div style="text-align: center;">
            <div id="status-display" class="status-badge" style="border-color: var(--primary);">Esperando Reloj...</div>
        </div>
    </div>

    <div class="card panel-controls">
        <h2>Entradas</h2>
        <div class="control-group">
            <div class="switch-row">
                <label for="sw-j">Entrada <strong>J</strong> (Set)</label>
                <label class="toggle">
                    <input type="checkbox" id="sw-j">
                    <span class="slider"></span>
                </label>
            </div>
            
            <div class="switch-row">
                <label for="sw-k">Entrada <strong>K</strong> (Reset)</label>
                <label class="toggle">
                    <input type="checkbox" id="sw-k">
                    <span class="slider"></span>
                </label>
            </div>

            <hr style="border: 0; border-top: 1px solid #ddd; width: 100%;">
            
            <button id="btn-pulse" class="btn-clock">
                PULSAR RELOJ (CLOCK)
            </button>
            <small style="color: #666; text-align: center;">El estado solo cambia en el flanco de subida.</small>
        </div>
    </div>

    <div class="card panel-scope">
        <h2>Cronograma (Osciloscopio)</h2>
        <canvas id="scopeCanvas"></canvas>
        <div class="legend">
            <span><span class="dot" style="background: cyan;"></span>CLK</span>
            <span><span class="dot" style="background: yellow;"></span>J</span>
            <span><span class="dot" style="background: magenta;"></span>K</span>
            <span><span class="dot" style="background: lime;"></span>Q</span>
        </div>
    </div>
</main>

<footer>
    (C) 2026, Prof. Jorge López-Cifre, PhD
</footer>

<script>
    // --- Referencias DOM ---
    const swJ = document.getElementById('sw-j');
    const swK = document.getElementById('sw-k');
    const btnPulse = document.getElementById('btn-pulse');
    const statusDisplay = document.getElementById('status-display');

    // Elementos SVG
    const wireJ = document.getElementById('wire-j');
    const wireK = document.getElementById('wire-k');
    const wireClk = document.getElementById('wire-clk');
    const wireQ = document.getElementById('wire-q');
    const wireQnot = document.getElementById('wire-qnot');
    const ledQ = document.getElementById('led-q');
    const ledQnot = document.getElementById('led-qnot');

    // Canvas
    const canvas = document.getElementById('scopeCanvas');
    const ctx = canvas.getContext('2d');

    // --- Estado del Sistema ---
    let state = {
        Q: 0,
        J: 0,
        K: 0,
        Clk: 0
    };

    // --- Funciones de Navegación ---
    function goBack() {
        if(document.referrer) window.location.href = document.referrer;
        else window.history.back();
    }

    // --- Lógica del Flip Flop JK ---
    function triggerClock() {
        // Lógica de flanco de subida
        let nextQ = state.Q;
        let mode = "";

        if (state.J === 0 && state.K === 0) {
            nextQ = state.Q; // Hold
            mode = "MEMORIA (Sin cambio)";
        } else if (state.J === 0 && state.K === 1) {
            nextQ = 0; // Reset
            mode = "RESET (Puesta a 0)";
        } else if (state.J === 1 && state.K === 0) {
            nextQ = 1; // Set
            mode = "SET (Puesta a 1)";
        } else if (state.J === 1 && state.K === 1) {
            nextQ = state.Q === 0 ? 1 : 0; // Toggle
            mode = "BASCULACIÓN (Toggle)";
        }

        state.Q = nextQ;
        updateVisuals(mode);
    }

    // --- Actualización Visual (SVG y Textos) ---
    function updateVisuals(modeText) {
        // Colorear cables de entrada
        if(state.J) wireJ.classList.add('wire-active'); else wireJ.classList.remove('wire-active');
        if(state.K) wireK.classList.add('wire-active'); else wireK.classList.remove('wire-active');
        
        // Colorear salidas y LEDs
        if (state.Q === 1) {
            wireQ.classList.add('wire-active');
            ledQ.classList.add('led-active');
            
            wireQnot.classList.remove('wire-active');
            ledQnot.classList.remove('led-active');
        } else {
            wireQ.classList.remove('wire-active');
            ledQ.classList.remove('led-active');
            
            wireQnot.classList.add('wire-active');
            ledQnot.classList.add('led-active');
        }

        if(modeText) {
            statusDisplay.textContent = modeText + " -> Q=" + state.Q;
            // Cambiar color del borde del status para feedback visual
            statusDisplay.style.borderColor = state.Q ? '#28a745' : '#dc3545';
        }
    }

    // --- Event Listeners ---
    swJ.addEventListener('change', (e) => {
        state.J = e.target.checked ? 1 : 0;
        updateVisuals(null); // Actualizar solo cables entrada
    });

    swK.addEventListener('change', (e) => {
        state.K = e.target.checked ? 1 : 0;
        updateVisuals(null);
    });

    // Manejo del botón de Reloj (Simula pulso)
    const handleClockDown = (e) => {
        if(e.cancelable) e.preventDefault(); // Evitar scroll en touch
        state.Clk = 1;
        wireClk.classList.add('wire-active'); // Feedback visual en el cable de reloj
        triggerClock();
    };

    const handleClockUp = (e) => {
        if(e.cancelable) e.preventDefault();
        state.Clk = 0;
        wireClk.classList.remove('wire-active');
    };

    btnPulse.addEventListener('mousedown', handleClockDown);
    btnPulse.addEventListener('mouseup', handleClockUp);
    btnPulse.addEventListener('touchstart', handleClockDown);
    btnPulse.addEventListener('touchend', handleClockUp);

    // --- Osciloscopio (Canvas Loop) ---
    // Historial de datos
    const historyLen = 300;
    const dataHistory = {
        clk: new Array(historyLen).fill(0),
        j: new Array(historyLen).fill(0),
        k: new Array(historyLen).fill(0),
        q: new Array(historyLen).fill(0)
    };

    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = 120;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawScope() {
        // Actualizar datos
        dataHistory.clk.shift(); dataHistory.clk.push(state.Clk);
        dataHistory.j.shift(); dataHistory.j.push(state.J);
        dataHistory.k.shift(); dataHistory.k.push(state.K);
        dataHistory.q.shift(); dataHistory.q.push(state.Q);

        // Limpiar
        ctx.fillStyle = "#222";
        ctx.fillRect(0,0, canvas.width, canvas.height);

        // Dibujar Grid
        ctx.strokeStyle = "#333";
        ctx.lineWidth = 1;
        ctx.beginPath();
        for(let x=0; x<canvas.width; x+=40) { ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); }
        ctx.stroke();

        // Dibujar Señales
        drawSignal(dataHistory.clk, 'cyan', 20);
        drawSignal(dataHistory.j, 'yellow', 50);
        drawSignal(dataHistory.k, 'magenta', 80);
        drawSignal(dataHistory.q, 'lime', 110); // Q abajo

        requestAnimationFrame(drawScope);
    }

    function drawSignal(data, color, yBase) {
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        
        const step = canvas.width / historyLen;
        const h = 15; // Altura de la onda

        for(let i=0; i<data.length; i++) {
            let x = i * step;
            let val = data[i];
            let y = yBase - (val * h); // Si es 1 sube, si es 0 queda en base
            
            if(i===0) ctx.moveTo(x, y);
            else {
                // Onda cuadrada perfecta
                let prevVal = data[i-1];
                let prevY = yBase - (prevVal * h);
                ctx.lineTo(x, prevY);
                ctx.lineTo(x, y);
            }
        }
        ctx.stroke();
    }

    // Inicialización
    updateVisuals("Estado Inicial");
    drawScope();

</script>
</body>
</html>
